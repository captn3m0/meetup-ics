name: publish
on:
  push:
    branches:
      - main
  schedule:
    # Runs daily at 7:00 AM CEST (5:00 AM UTC)
    - cron: '0 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install the default version of uv
        id: setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build
        env:
          MEETUP_AUTH_ACCESS_TOKEN: ${{ secrets.meetup }}
          STEPS_SETUP_UV_OUTPUTS_UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "Installed uv version is ${STEPS_SETUP_UV_OUTPUTS_UV_VERSION}"
          uv run generate.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "out/"
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
